[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "denialdesk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic-settings>=2.0",
    "python-dotenv",
    "faker",
    "pdfplumber>=0.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "aiosqlite",
]

[tool.hatch.build.targets.wheel]
packages = ["denialdesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
