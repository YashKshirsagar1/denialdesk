# Production compose — secrets injected from environment, never hardcoded.
# Usage: docker compose -f docker-compose.prod.yml up -d
# Set all required vars from deploy/.env.prod.example via your secrets manager before running.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports exposed — only accessible within the compose network.

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      DEV_MODE: "false"
      # Inject from secrets manager — never hardcode:
      # AUTH0_DOMAIN, AUTH0_AUDIENCE, ANTHROPIC_API_KEY
    depends_on: [db]
    volumes:
      - uploads:/app/data/uploads
      - statements:/app/data/statements

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS certs managed by certbot or the load balancer:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [api]

volumes:
  postgres_data:
  uploads:
  statements:
